name: Decision
description: 구현 전에 필요한 설계 결정과 승인 근거를 준비합니다.
title: "[Decision] "
labels:
  - decision
body:
  - type: markdown
    attributes:
      value: |
        공개 API, DB, production 의존성, 아키텍처 경계 또는 되돌리기 어려운 선택은 승인 후 docs/decisions의 ADR로 남깁니다.
        이 Issue의 제안은 승인된 결정이나 구현 권한을 의미하지 않습니다.

  - type: textarea
    id: context
    attributes:
      label: 배경과 문제
      description: 어떤 문제와 제약 때문에 지금 결정이 필요한지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 관련 계약과 선행 결정
      description: GitHub 문서 경로와 상태(APPROVED/DRAFT), ADR, Issue/PR을 적고 Notion은 참고 링크로 구분합니다.
    validations:
      required: true

  - type: textarea
    id: drivers
    attributes:
      label: 결정 기준과 제약
      description: 보안, 호환성, 운영 복잡도, 비용과 일정 등 선택지를 평가할 기준을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 선택지와 장단점
      description: 현실적인 대안을 둘 이상 비교하고, 가능하면 아무것도 바꾸지 않는 선택도 포함합니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안과 근거
      description: 권장 선택, 적용 범위, 제외 범위와 트레이드오프를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 분석
      description: 공개 API, 도메인, DB/마이그레이션, production 의존성, 아키텍처, 보안과 운영 영향을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 검증과 되돌리기
      description: 성공 기준, 실패 신호, 롤백 또는 대체 계획을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: 미결정 사항과 필요한 승인자
      description: 추가 조사, 의존 결정, 결정권자와 목표 시점을 적습니다. 없으면 "없음"으로 작성합니다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: ADR 브랜치 slug
      description: 승인 후 codex/{issue-number}-{slug} 브랜치와 전용 worktree에 사용합니다.
      placeholder: choose-persistence-strategy
    validations:
      required: true

  - type: checkboxes
    id: decision_boundary
    attributes:
      label: 결정 경계 확인
      options:
        - label: 승인 전에는 제안 내용을 확정 계약으로 간주하지 않습니다.
          required: true
        - label: 승인되면 docs/decisions/template.md에 따라 ADR을 추가하거나 갱신합니다.
          required: true
        - label: 구현은 승인 후 별도의 구현 Issue로 추적합니다.
          required: true
