name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build, test, and package
        run: ./gradlew clean check bootJar --no-daemon

  deploy:
    name: deploy dev
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: guardbench-dev-application-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve immutable image URI
        id: image
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${IMAGE_TAG} as ${image_uri}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push image when the commit tag is new
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Reusing immutable ECR image ${IMAGE_URI}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "$(cut -d/ -f1 <<< "$IMAGE_URI")"
          ./gradlew bootBuildImage --imageName="$IMAGE_URI" --no-daemon
          docker push "$IMAGE_URI"
          echo "Pushed immutable ECR image ${IMAGE_URI}" >> "$GITHUB_STEP_SUMMARY"
      - name: Register revision from the current service task definition
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          current_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          test -n "$current_task_definition"
          test "$current_task_definition" != "None"

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            --output json > current-task-definition.json

          container_count="$(jq --arg name "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $name)] | length' \
            current-task-definition.json)"
          test "$container_count" = "1"

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == $name then .image = $image else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
          ' current-task-definition.json > next-task-definition.json

          target_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file://next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=${target_task_definition}" >> "$GITHUB_OUTPUT"
          {
            echo "Current task definition: ${current_task_definition}"
            echo "Target task definition: ${target_task_definition}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy and verify target revision
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          TARGET_TASK_DEFINITION: ${{ steps.task-definition.outputs.arn }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TARGET_TASK_DEFINITION" >/dev/null

          if ! aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"; then
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].{taskDefinition:taskDefinition,deployments:deployments,events:events[0:10]}' \
              --output json
            echo "ECS did not stabilize while deploying ${TARGET_TASK_DEFINITION}." >&2
            exit 1
          fi

          service_state="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0]' \
            --output json)"
          actual_task_definition="$(jq -r '.taskDefinition' <<< "$service_state")"
          primary_rollout_state="$(jq -r '
            [.deployments[] | select(.status == "PRIMARY") | .rolloutState] | first // empty
          ' <<< "$service_state")"

          echo "$service_state" | jq '{taskDefinition, deployments, events: .events[0:10]}'
          {
            echo "Commit: ${IMAGE_TAG}"
            echo "Image: ${IMAGE_URI}"
            echo "Target task definition: ${TARGET_TASK_DEFINITION}"
            echo "Service task definition after stabilization: ${actual_task_definition}"
            echo "Primary rollout state: ${primary_rollout_state}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$actual_task_definition" != "$TARGET_TASK_DEFINITION" \
            || "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "Target deployment failed or rolled back; the service is not using the requested revision." >&2
            exit 1
          fi
