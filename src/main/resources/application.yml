spring:
  application:
    name: guardbench-backend
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-and-stop
      skip:
        in-tests: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    fail-on-missing-locations: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      # 알 수 없는 Request Body 필드는 무시하지 않고 VALIDATION_ERROR로 거부한다.
      fail-on-unknown-properties: true

# SQS 런타임 설정 (DefaultCredentialsProvider 체인 사용, Spring Cloud AWS 없음)
# SQS 빈 활성화: guardbench.sqs.enabled=true일 때만 SqsClient를 생성한다.
guardbench:
  # MVP operator catalog: 19 canonical entries (7 check sets; PII-only collapses strictness).
  # Identifiers and revisions are environment-overridable for pre-provisioned immutable Guardrails.
  evaluator-catalog:
    entries:
      - { checks: [PROMPT_INJECTION], strictness: RELAXED, guardrail-identifier: "${EVALUATOR_CATALOG_G1_ID:guardbench-g1-prompt-injection}", guardrail-revision: "${EVALUATOR_CATALOG_G1_RELAXED_REVISION:1}" }
      - { checks: [PROMPT_INJECTION], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G1_ID:guardbench-g1-prompt-injection}", guardrail-revision: "${EVALUATOR_CATALOG_G1_STANDARD_REVISION:2}" }
      - { checks: [PROMPT_INJECTION], strictness: STRICT, guardrail-identifier: "${EVALUATOR_CATALOG_G1_ID:guardbench-g1-prompt-injection}", guardrail-revision: "${EVALUATOR_CATALOG_G1_STRICT_REVISION:3}" }
      - { checks: [PII_LEAKAGE], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G2_ID:guardbench-g2-pii-leakage}", guardrail-revision: "${EVALUATOR_CATALOG_G2_REVISION:1}" }
      - { checks: [HARMFUL_CONTENT], strictness: RELAXED, guardrail-identifier: "${EVALUATOR_CATALOG_G3_ID:guardbench-g3-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G3_RELAXED_REVISION:1}" }
      - { checks: [HARMFUL_CONTENT], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G3_ID:guardbench-g3-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G3_STANDARD_REVISION:2}" }
      - { checks: [HARMFUL_CONTENT], strictness: STRICT, guardrail-identifier: "${EVALUATOR_CATALOG_G3_ID:guardbench-g3-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G3_STRICT_REVISION:3}" }
      - { checks: [PROMPT_INJECTION, PII_LEAKAGE], strictness: RELAXED, guardrail-identifier: "${EVALUATOR_CATALOG_G4_ID:guardbench-g4-prompt-injection-pii}", guardrail-revision: "${EVALUATOR_CATALOG_G4_RELAXED_REVISION:1}" }
      - { checks: [PROMPT_INJECTION, PII_LEAKAGE], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G4_ID:guardbench-g4-prompt-injection-pii}", guardrail-revision: "${EVALUATOR_CATALOG_G4_STANDARD_REVISION:2}" }
      - { checks: [PROMPT_INJECTION, PII_LEAKAGE], strictness: STRICT, guardrail-identifier: "${EVALUATOR_CATALOG_G4_ID:guardbench-g4-prompt-injection-pii}", guardrail-revision: "${EVALUATOR_CATALOG_G4_STRICT_REVISION:3}" }
      - { checks: [PROMPT_INJECTION, HARMFUL_CONTENT], strictness: RELAXED, guardrail-identifier: "${EVALUATOR_CATALOG_G5_ID:guardbench-g5-prompt-injection-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G5_RELAXED_REVISION:1}" }
      - { checks: [PROMPT_INJECTION, HARMFUL_CONTENT], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G5_ID:guardbench-g5-prompt-injection-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G5_STANDARD_REVISION:2}" }
      - { checks: [PROMPT_INJECTION, HARMFUL_CONTENT], strictness: STRICT, guardrail-identifier: "${EVALUATOR_CATALOG_G5_ID:guardbench-g5-prompt-injection-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G5_STRICT_REVISION:3}" }
      - { checks: [PII_LEAKAGE, HARMFUL_CONTENT], strictness: RELAXED, guardrail-identifier: "${EVALUATOR_CATALOG_G6_ID:guardbench-g6-pii-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G6_RELAXED_REVISION:1}" }
      - { checks: [PII_LEAKAGE, HARMFUL_CONTENT], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G6_ID:guardbench-g6-pii-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G6_STANDARD_REVISION:2}" }
      - { checks: [PII_LEAKAGE, HARMFUL_CONTENT], strictness: STRICT, guardrail-identifier: "${EVALUATOR_CATALOG_G6_ID:guardbench-g6-pii-harmful-content}", guardrail-revision: "${EVALUATOR_CATALOG_G6_STRICT_REVISION:3}" }
      - { checks: [PROMPT_INJECTION, PII_LEAKAGE, HARMFUL_CONTENT], strictness: RELAXED, guardrail-identifier: "${EVALUATOR_CATALOG_G7_ID:guardbench-g7-all-checks}", guardrail-revision: "${EVALUATOR_CATALOG_G7_RELAXED_REVISION:1}" }
      - { checks: [PROMPT_INJECTION, PII_LEAKAGE, HARMFUL_CONTENT], strictness: STANDARD, guardrail-identifier: "${EVALUATOR_CATALOG_G7_ID:guardbench-g7-all-checks}", guardrail-revision: "${EVALUATOR_CATALOG_G7_STANDARD_REVISION:2}" }
      - { checks: [PROMPT_INJECTION, PII_LEAKAGE, HARMFUL_CONTENT], strictness: STRICT, guardrail-identifier: "${EVALUATOR_CATALOG_G7_ID:guardbench-g7-all-checks}", guardrail-revision: "${EVALUATOR_CATALOG_G7_STRICT_REVISION:3}" }
  sqs:
    enabled: ${SQS_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${SQS_ENDPOINT_OVERRIDE:}
    polling:
      max-messages: 10
      wait-time-seconds: 20
      visibility-timeout-seconds: 30
    outbox:
      # 발행 트랜잭션이 PENDING row lock을 SQS 전송 동안 유지하므로 batch는 작게 유지한다.
      batch-size: 10
      delay-ms: 1000
  worker:
    enabled: ${WORKER_ENABLED:false}
  # Bedrock Provider 호출 한도 (ADR 0005: 재시도 포함 전체 15초, claim lease 45초 미만)
  bedrock:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${BEDROCK_ENDPOINT_OVERRIDE:}
    api-call-timeout-ms: 15000
    api-call-attempt-timeout-ms: 5000
    max-attempts: 3
