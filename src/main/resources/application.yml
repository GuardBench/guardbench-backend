spring:
  application:
    name: guardbench-backend
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-and-stop
      skip:
        in-tests: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    fail-on-missing-locations: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      # 알 수 없는 Request Body 필드는 무시하지 않고 VALIDATION_ERROR로 거부한다.
      fail-on-unknown-properties: true

# SQS 런타임 설정 (DefaultCredentialsProvider 체인 사용, Spring Cloud AWS 없음)
# SQS 빈 활성화: guardbench.sqs.enabled=true일 때만 SqsClient를 생성한다.
guardbench:
  sqs:
    enabled: ${SQS_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${SQS_ENDPOINT_OVERRIDE:}
    polling:
      max-messages: 10
      wait-time-seconds: 20
      visibility-timeout-seconds: 30
    outbox:
      # 발행 트랜잭션이 PENDING row lock을 SQS 전송 동안 유지하므로 batch는 작게 유지한다.
      batch-size: 10
      delay-ms: 1000
  worker:
    enabled: ${WORKER_ENABLED:false}
  # Bedrock Provider 호출 한도 (ADR 0005: 재시도 포함 전체 15초, claim lease 45초 미만)
  bedrock:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${BEDROCK_ENDPOINT_OVERRIDE:}
    api-call-timeout-ms: 15000
    api-call-attempt-timeout-ms: 5000
    max-attempts: 3
