test:
  id: PERF-SMALL
  name: baseline smoke
  type: SMOKE

# Profile은 실행량과 acceptance criteria만 소유한다. 어떤 TestCase를 실행할지는 Dataset이 소유한다.
workload:
  concurrent_test_runs: 1
  ramp_up_seconds: 0
  duration_seconds: 10
  max_iterations_per_vu: 1
  completion_timeout_seconds: 300
  polling_interval_seconds: 2

# 배포별 URL·model은 환경변수로 주입한다. Profile을 복사해 target/peak/stress/soak를 만들 수 있다.
target:
  type: HTTP_ENDPOINT
  identifier: "${PERF_TARGET_URL}"
  model: "${PERF_TARGET_MODEL}"
  revision: "${PERF_TARGET_REVISION}"
  evaluation_profile:
    checks: [PROMPT_INJECTION]
    strictness: STANDARD

acceptance:
  api:
    create_latency_ms:
      p50: 1000
      p95: 2000
      p99: 3000
    error_rate: 0.0
  completion:
    max_seconds: 300
    failure_rate: 0.0
    queue_drain_seconds: 120
    dlq_messages: 0
